<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoneBot 人造石排板系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <img src="/static/logo.png" alt="StoneBot" class="logo">
  <h1>StoneBot 排板助手</h1>
  <button class="btn-reset" onclick="resetChat()" title="重新开始">↺</button>
</header>

<!-- Chat area -->
<main class="chat-container" id="chatContainer">
  <div class="message assistant">
    <div class="avatar">🤖</div>
    <div class="bubble">
      <p>欢迎使用人造石排板系统！</p>
      <p>请输入大板尺寸开始排板，例如：<code>3200 1800 18</code></p>
      <p>或者直接上传 DXF 文件。</p>
    </div>
  </div>
</main>

<!-- Input area -->
<footer class="input-area">
  <label class="btn-upload" title="上传 DXF">
    📎
    <input type="file" id="fileInput" accept=".dxf" onchange="uploadFile()">
  </label>
  <input type="text" id="msgInput" placeholder="输入消息..." autofocus
         onkeydown="if(event.key==='Enter')sendMessage()">
  <button class="btn-send" onclick="sendMessage()">发送</button>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
