<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>识图排板对话</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --border: #e5e7eb;
      --user: #e8f1ff;
      --assistant: #f9fafb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --warning: #d97706;
      --warning-soft: #fffbeb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 { margin: 0; font-size: 18px; }
    header .subtitle { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    header nav { display: flex; align-items: center; gap: 10px; }
    header a { color: var(--accent); text-decoration: none; font-size: 13px; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 100px);
    }

    #messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 16px;
    }

    .message {
      max-width: 82%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }

    .message.user { align-self: flex-end; background: var(--user); }
    .message.assistant { align-self: flex-start; background: var(--assistant); }
    .message pre {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--muted);
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .attachment {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .downloads { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .downloads a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      background: var(--panel);
    }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 20px;
      color: var(--muted);
      line-height: 1.7;
    }
    .empty-state h2 { margin: 0 0 8px; font-size: 16px; color: var(--text); }
    .empty-state ol { margin: 8px 0; padding-left: 20px; }
    .empty-state code {
      font-size: 12px;
      background: var(--accent-soft);
      border-radius: 6px;
      padding: 1px 6px;
      color: var(--accent);
    }

    .correction-targets {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .correction-targets select {
      width: 100%;
      min-height: 92px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      color: var(--text);
      background: var(--panel);
    }
    .correction-target-summary {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }
    .learning-scope {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .learning-scope select {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 6px;
      font: inherit;
      color: var(--text);
      background: var(--panel);
    }    .active-learning {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .active-learning-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .active-learning-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .active-learning-item {
      text-align: left;
      max-width: 280px;
      font-size: 12px;
      background: var(--warning-soft);
      border-color: #fcd34d;
      color: #92400e;
    }
    .active-learning-item small { display: block; color: var(--muted); margin-top: 2px; }    .drawing-preview {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }
    .drawing-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .drawing-preview-title { display: flex; flex-direction: column; gap: 2px; }
    .drawing-preview-title small { color: var(--muted); font-size: 12px; }
    .drawing-preview-actions { display: flex; align-items: center; gap: 6px; }
    .drawing-preview-actions button {
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
    }
    .drawing-preview-actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 8px;
      background: var(--panel);
    }
    .drawing-preview-stage {
      height: min(58vh, 560px);
      min-height: 340px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background:
        linear-gradient(90deg, rgba(148, 163, 184, .14) 1px, transparent 1px),
        linear-gradient(rgba(148, 163, 184, .14) 1px, transparent 1px),
        #fbfdff;
      background-size: 24px 24px;
    }
    #drawing-preview-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }
    .preview-shape {
      vector-effect: non-scaling-stroke;
      stroke-width: 1.15;
      transition: fill .12s ease, stroke .12s ease;
    }
    .preview-panel { fill: rgba(37, 99, 235, .10); stroke: #1e3a8a; }
    .preview-hole { fill: rgba(255, 255, 255, .78); stroke: var(--warning); }
    .preview-unrecognized {
      fill: rgba(220, 38, 38, .10);
      stroke: var(--danger);
      stroke-dasharray: 6 4;
    }
    .preview-shape:hover { fill: rgba(251, 191, 36, .28); }
    .preview-shape.attention:not(.selected) {
      stroke: #ea580c;
      stroke-dasharray: 5 3;
      stroke-width: 2.2;
    }    .preview-shape.selected {
      fill: rgba(251, 191, 36, .46);
      stroke: #b45309;
      stroke-width: 2.8;
    }
    .preview-label {
      fill: #172554;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, .9);
      stroke-width: 3px;
      pointer-events: none;
    }
    .preview-label.selected { fill: #9a3412; }
    .drawing-preview-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      padding: 20px;
      text-align: center;
    }
    .preview-hint { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .preview-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
    .preview-legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 5px;
      border: 1px solid currentColor;
      vertical-align: -1px;
    }
    .preview-legend .panel::before { background: rgba(37, 99, 235, .16); color: #1e3a8a; }
    .preview-legend .hole::before { background: white; color: var(--warning); }
    .preview-legend .unrecognized::before { background: rgba(220, 38, 38, .12); color: var(--danger); }
    .job-panel {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 14px;
    }
    .job-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .panel-kicker { font-size: 12px; color: var(--muted); }
    .job-id { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .pill {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .pill-wait { background: var(--warning-soft); color: var(--warning); }
    .pill-success { background: var(--success-soft); color: var(--success); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }

    .steps {
      display: flex;
      gap: 6px;
      list-style: none;
      margin: 0 0 12px;
      padding: 0 0 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }
    .step {
      min-width: 74px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      flex: 0 0 auto;
    }
    .step.done .step-dot { background: var(--success); }
    .step.current .step-dot {
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .step.done, .step.current { color: var(--text); }
    .step small { display: block; color: var(--muted); font-size: 11px; }

    .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .metric {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .metric strong { color: var(--text); margin-right: 4px; }

    .next-action {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
    }
    .next-action span { color: var(--muted); }

    .error-box {
      margin-top: 10px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      padding: 8px 10px;
      font-size: 13px;
    }

    details { margin-top: 10px; font-size: 12px; color: var(--muted); }
    details summary { cursor: pointer; }

    .composer {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding-top: 8px;
    }
    .composer-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      min-height: 56px;
      resize: vertical;
      border: 0;
      outline: none;
      font: inherit;
      color: inherit;
    }

    .file-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .file-picker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
      background: var(--accent-soft);
    }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
      background: var(--panel);
      color: var(--muted);
    }
    .file-chip button {
      border: 0;
      background: transparent;
      color: var(--accent);
      padding: 0;
      cursor: pointer;
      font-size: 12px;
    }

    .parameter-panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fcfcfd;
    }
    .parameter-panel summary {
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .parameter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: var(--muted);
    }
    .field input,
    .field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 8px;
      font: inherit;
      color: var(--text);
      background: var(--panel);
    }
    .field input:disabled,
    .field select:disabled {
      background: #f3f4f6;
      color: #9ca3af;
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      padding-top: 18px;
    }
    .derived-size {
      margin-top: 8px;
      font-size: 12px;
      color: var(--accent);
    }
    .prompt-label { font-size: 12px; color: var(--muted); }
    .prompt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .prompt-chips button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
    }
    .prompt-chips button:hover { color: var(--accent); border-color: var(--accent); }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .status-line { font-size: 12px; color: var(--muted); min-height: 16px; }
    .status-line.error { color: var(--danger); }
    .status-line.success { color: var(--success); }

    @media (max-width: 640px) {
      main { padding: 12px; }
      .message { max-width: 92%; }
      .parameter-grid { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>识图排板对话</h1>
      <p class="subtitle">上传 DXF → 参数确认 → 审图确认 → 排板确认</p>
    </div>
    <nav>
      <a href="../">返回总界面</a>
      <button id="btn-new" type="button">新会话</button>
    </nav>
  </header>

  <main>
    <div id="messages"></div>

    <section id="job-panel" class="job-panel" hidden>
      <div class="job-panel-head">
        <div>
          <span class="panel-kicker">当前任务</span>
          <code id="job-id" class="job-id"></code>
        </div>
        <span id="job-pill" class="pill"></span>
      </div>
      <ol id="workflow-steps" class="steps"></ol>
      <div id="job-metrics" class="metrics"></div>
      <div id="correction-targets" class="correction-targets" hidden>
        <div class="parameter-label">纠错目标（可多选）</div>
        <select id="correction-target-select" multiple size="5"></select>
        <div id="correction-target-summary" class="correction-target-summary">未选择目标</div>
        <div class="learning-scope">
          <label for="correction-feedback-scope">学习范围</label>
          <select id="correction-feedback-scope">
            <option value="project">仅本项目（推荐）</option>
            <option value="global">参与全局模型</option>
            <option value="none">不学习</option>
          </select>
          <span id="learning-memory-summary">项目记忆尚未更新</span>
        </div>
      </div>
      <div id="active-learning" class="active-learning" hidden>
        <div class="active-learning-head">
          <strong>建议优先确认</strong>
          <span id="active-learning-count"></span>
        </div>
        <div id="active-learning-list" class="active-learning-list"></div>
      </div>
      <div id="drawing-preview" class="drawing-preview" hidden>
        <div class="drawing-preview-head">
          <div class="drawing-preview-title">
            <strong>原位 DXF 预览</strong>
            <small id="drawing-preview-summary">正在加载几何...</small>
          </div>
          <div class="drawing-preview-actions">
            <button id="drawing-preview-zoom-out" type="button" title="缩小">−</button>
            <button id="drawing-preview-fit" type="button">适应</button>
            <button id="drawing-preview-zoom-in" type="button" title="放大">＋</button>
            <a id="drawing-preview-download" href="#" hidden>下载原位 DXF</a>
          </div>
        </div>
        <div class="preview-legend">
          <span class="panel">规格板</span>
          <span class="hole">孔洞</span>
          <span class="unrecognized">未识别封闭实体</span>
          <span>黄色高亮 = 已选择纠错目标</span>
        </div>
        <div id="drawing-preview-stage" class="drawing-preview-stage">
          <svg id="drawing-preview-svg" role="img" aria-label="原位 DXF 几何预览"></svg>
          <div id="drawing-preview-empty" class="drawing-preview-empty" hidden></div>
        </div>
        <div class="preview-hint">单击图形可直接选中或取消；滚轮缩放，点击“适应”恢复全图。</div>
      </div>
      <div id="next-action" class="next-action"></div>
      <div id="job-error" class="error-box" hidden></div>
    </section>

    <div class="composer">
      <div class="composer-box">
        <div class="file-row">
          <label class="file-picker" for="file">
            <span aria-hidden="true">📎</span>
            <span id="file-picker-label">选择 DXF 文件</span>
            <input id="file" type="file" accept=".dxf" hidden>
          </label>
          <div id="file-chip" class="file-chip" hidden>
            <span id="file-name"></span>
            <button id="file-clear" type="button">清除</button>
          </div>
        </div>
        <details id="parameter-panel" class="parameter-panel" open>
          <summary>排板参数</summary>
          <div class="parameter-grid">
            <label class="field">加工方法
              <select id="param-process">
                <option value="bridge">桥切圆盘锯</option>
                <option value="waterjet">水刀</option>
                <option value="laser">激光</option>
              </select>
            </label>
            <label class="field">大板标称长 (mm)
              <input id="param-width" type="number" min="1" step="1" value="3200">
            </label>
            <label class="field">大板标称宽 (mm)
              <input id="param-height" type="number" min="1" step="1" value="1800">
            </label>
            <label class="field">大板厚度 (mm)
              <input id="param-thickness" type="number" min="1" step="1" value="20">
            </label>
            <label class="field">可利用长 (mm)
              <input id="param-usable-width" type="number" min="1" step="1" value="3200">
            </label>
            <label class="field">可利用宽 (mm)
              <input id="param-usable-height" type="number" min="1" step="1" value="1800">
            </label>
            <label class="field">让尺长度 (mm)
              <input id="param-oversize-width" type="number" min="0" step="1" value="0" disabled>
            </label>
            <label class="field">让尺宽度 (mm)
              <input id="param-oversize-height" type="number" min="0" step="1" value="0" disabled>
            </label>
            <label class="field">让尺口径
              <select id="param-oversize-mode" disabled>
                <option value="total">总加量</option>
                <option value="per_side">每边加量</option>
              </select>
            </label>
            <label class="field">刀厚 / 有效刀缝 (mm)
              <input id="param-kerf" type="number" min="0" step="0.1" value="5">
            </label>
            <label class="checkbox-field">
              <input id="param-oversize-enabled" type="checkbox">
              利用让尺
            </label>
          </div>
          <div id="derived-size" class="derived-size">实际可用尺寸：3200 × 1800 mm</div>
        </details>
        <textarea id="input" placeholder="上传 DXF 后确认参数，可补充说明或直接点击发送"></textarea>
        <div class="prompt-label">常用指令（点击填入）</div>
        <div class="prompt-chips">
          <button type="button" data-fill="3200x1800 排板">3200x1800 排板</button>
          <button type="button" data-fill="2500x1400 排板">2500x1400 排板</button>
          <button type="button" data-fill="发现原位DXF错误：P-0001 应该改为 P-0001A">纠正原位DXF</button>
          <button type="button" data-fill="板数不合适，回看能不能少一张">回看减板</button>
        </div>
        <div class="composer-actions">
          <button id="send" class="primary">发送指令</button>
          <button id="btn-status" type="button" data-action="status">查看状态</button>
          <button id="btn-confirm" type="button" data-action="confirm">确认下一步</button>
          <button id="btn-run" type="button" data-action="run">继续运行</button>
          <button id="btn-review" type="button" data-action="review">回看减板</button>
          <button id="btn-cancel" type="button" data-action="cancel">取消任务</button>
        </div>
        <div id="status" class="status-line" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <script src="./portal-ui.js"></script>
  <script>
    const ui = window.StonebotUI;
    const API_BASE = ".";
    const CONVERSATION_KEY = "stonebot.nesting.conversationId";

    const state = {
      conversationId: null,
      lastUpload: null,
      messages: [],
      busy: false,
      currentJobId: null,
      latestStatus: null,
      selectedCorrectionTargets: [],
      activeLearningTargets: [],
      pollTimers: [],
      preview: null,
      previewJobId: null,
      previewRevision: null,
      previewRequestToken: 0,
      previewOriginalViewBox: null,
    };

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");
    const fileEl = document.getElementById("file");
    const fileChipEl = document.getElementById("file-chip");
    const fileNameEl = document.getElementById("file-name");
    const filePickerLabelEl = document.getElementById("file-picker-label");
    const statusEl = document.getElementById("status");
    const jobPanelEl = document.getElementById("job-panel");
    const jobIdEl = document.getElementById("job-id");
    const jobPillEl = document.getElementById("job-pill");
    const stepsEl = document.getElementById("workflow-steps");
    const metricsEl = document.getElementById("job-metrics");
    const nextActionEl = document.getElementById("next-action");
    const jobErrorEl = document.getElementById("job-error");
    const correctionTargetsEl = document.getElementById("correction-targets");
    const correctionTargetSelectEl = document.getElementById("correction-target-select");
    const correctionTargetSummaryEl = document.getElementById("correction-target-summary");
    const correctionFeedbackScopeEl = document.getElementById("correction-feedback-scope");
    const learningMemorySummaryEl = document.getElementById("learning-memory-summary");
    const activeLearningEl = document.getElementById("active-learning");
    const activeLearningListEl = document.getElementById("active-learning-list");
    const activeLearningCountEl = document.getElementById("active-learning-count");
    const drawingPreviewEl = document.getElementById("drawing-preview");
    const drawingPreviewSummaryEl = document.getElementById("drawing-preview-summary");
    const drawingPreviewSvgEl = document.getElementById("drawing-preview-svg");
    const drawingPreviewEmptyEl = document.getElementById("drawing-preview-empty");
    const drawingPreviewDownloadEl = document.getElementById("drawing-preview-download");
    const parameterEls = {
      process: document.getElementById("param-process"),
      width: document.getElementById("param-width"),
      height: document.getElementById("param-height"),
      thickness: document.getElementById("param-thickness"),
      usableWidth: document.getElementById("param-usable-width"),
      usableHeight: document.getElementById("param-usable-height"),
      oversizeEnabled: document.getElementById("param-oversize-enabled"),
      oversizeMode: document.getElementById("param-oversize-mode"),
      oversizeWidth: document.getElementById("param-oversize-width"),
      oversizeHeight: document.getElementById("param-oversize-height"),
      kerf: document.getElementById("param-kerf"),
      derivedSize: document.getElementById("derived-size"),
    };

    function parameterNumber(element, fallback = 0) {
      const value = Number(element.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function syncParameterControls() {
      const oversizeEnabled = parameterEls.oversizeEnabled.checked;
      parameterEls.oversizeMode.disabled = !oversizeEnabled;
      parameterEls.oversizeWidth.disabled = !oversizeEnabled;
      parameterEls.oversizeHeight.disabled = !oversizeEnabled;

      const dimensions = ui.effectiveSheetDimensions({
        usableWidth: parameterNumber(parameterEls.usableWidth),
        usableHeight: parameterNumber(parameterEls.usableHeight),
        oversizeEnabled,
        oversizeMode: parameterEls.oversizeMode.value,
        oversizeWidth: parameterNumber(parameterEls.oversizeWidth),
        oversizeHeight: parameterNumber(parameterEls.oversizeHeight),
      });
      parameterEls.derivedSize.textContent = (
        `实际可用尺寸：${dimensions.effectiveWidth.toFixed(1)} × `
        + `${dimensions.effectiveHeight.toFixed(1)} mm`
      );
    }

    function buildNestingParameters() {
      const process = parameterEls.process.value;
      const width = parameterNumber(parameterEls.width);
      const height = parameterNumber(parameterEls.height);
      const thickness = parameterNumber(parameterEls.thickness);
      const usableWidth = parameterNumber(parameterEls.usableWidth);
      const usableHeight = parameterNumber(parameterEls.usableHeight);
      const oversizeEnabled = parameterEls.oversizeEnabled.checked;
      const oversizeWidth = parameterNumber(parameterEls.oversizeWidth);
      const oversizeHeight = parameterNumber(parameterEls.oversizeHeight);
      const kerf = parameterNumber(parameterEls.kerf);

      const validationErrors = ui.validateNestingParameters({
        process,
        width,
        height,
        thickness,
        usableWidth,
        usableHeight,
        oversizeEnabled,
        oversizeWidth,
        oversizeHeight,
        kerf,
      });
      if (validationErrors.length) throw new Error(validationErrors[0]);

      return {
        width_mm: width,
        height_mm: height,
        thickness_mm: thickness,
        usable_width_mm: usableWidth,
        usable_height_mm: usableHeight,
        oversize_enabled: oversizeEnabled,
        oversize_mode: parameterEls.oversizeMode.value,
        oversize_width_mm: oversizeEnabled ? oversizeWidth : 0,
        oversize_height_mm: oversizeEnabled ? oversizeHeight : 0,
        kerf_mm: kerf,
        process,
        profile: process === "waterjet" ? "waterjet" : process === "laser" ? "laser" : "min_sheets",
        rotation_degrees: process === "bridge" ? [0, 90, 180, 270] : null,
        allow_shared_edge: true,
        pairing: process !== "bridge",
        skip_unnumbered: true,
      };
    }

    function setStatus(text, kind = "info") {
      statusEl.textContent = text;
      statusEl.className = `status-line${kind === "error" ? " error" : kind === "success" ? " success" : ""}`;
    }

    function currentStatus() {
      return ui.latestJobStatus(state.messages) || state.latestStatus || null;
    }

    function currentJobId() {
      return ui.latestJobId(state.messages) || state.currentJobId || null;
    }

    function setBusy(value) {
      state.busy = value;
      sendEl.disabled = value;
      updateActionButtons();
    }

    function stopPolling() {
      state.pollTimers.forEach((timer) => clearInterval(timer));
      state.pollTimers = [];
    }

    function updateLatestStatus(status) {
      if (!status || !status.job_id) return;
      state.latestStatus = status;
      state.currentJobId = status.job_id;
    }

    function renderWelcome() {
      messagesEl.innerHTML = `
        <div class="empty-state">
          <h2>如何开始</h2>
          <ol>
            <li>点击 <strong>选择 DXF 文件</strong>，上传图纸。</li>
            <li>确认加工方法、大板尺寸、让尺和桥切刀缝。</li>
            <li>任务到达审图、排板、后处理阶段时，点击 <strong>确认下一步</strong>。</li>
          </ol>
        </div>
      `;
    }

    function renderMetrics(status) {
      const metrics = ui.jobMetrics(status);
      const items = [];
      if (metrics.parts !== undefined) {
        items.push(`<div class="metric"><strong>${metrics.parts}</strong>个面板</div>`);
      }
      if (metrics.total_sheets !== undefined) {
        items.push(`<div class="metric"><strong>${metrics.total_sheets}</strong>张板</div>`);
      }
      if (metrics.yield_rate !== undefined) {
        items.push(`<div class="metric"><strong>${Number(metrics.yield_rate).toFixed(2)}%</strong>出材率</div>`);
      }
      if (metrics.audit_issues !== undefined) {
        items.push(`<div class="metric"><strong>${metrics.audit_issues}</strong>个审图问题</div>`);
      }
      if (metrics.geometry_errors !== undefined) {
        items.push(`<div class="metric"><strong>${metrics.geometry_errors}</strong>个几何错误</div>`);
      }
      if (metrics.template) {
        items.push(`<div class="metric"><strong>${ui.escapeHtml(metrics.template)}</strong>模板命中</div>`);
      }
      return items.length
        ? items.join("")
        : '<div class="metric">后台处理中，完成后显示板数、出材率等信息</div>';
    }

    function renderDownloads(status) {
      if (!status || !status.job_id) return "";
      const jobId = encodeURIComponent(status.job_id);
      const artifacts = ui.jobArtifacts(status);
      const links = Object.entries(artifacts)
        .filter(([key, path]) => path)
        .map(([key]) => (
          `<a href="${API_BASE}/jobs/${jobId}/artifacts/${encodeURIComponent(key)}">${ui.escapeHtml(ui.artifactLabel(key))}</a>`
        ));
      return links.length ? `<div class="downloads">${links.join("")}</div>` : "";
    }

    function renderJobCard(status) {
      const metrics = renderMetrics(status);
      const downloads = renderDownloads(status);
      const error = status.error
        ? `<div class="error-box">${ui.escapeHtml(status.error)}</div>`
        : "";
      return `
        <div class="job-card">
          <div class="metrics">${metrics}</div>
          ${downloads}
          ${error}
          <details>
            <summary>查看原始数据</summary>
            <pre>${ui.escapeHtml(JSON.stringify(status, null, 2))}</pre>
          </details>
        </div>
      `;
    }

    function renderMessages() {
      if (!state.messages.length) {
        renderWelcome();
        updateActionButtons();
        return;
      }
      messagesEl.innerHTML = state.messages.map((message) => {
        const attachments = (message.attachments || []).map((item) => {
          const path = item.dxf_path || item.path || item.local_path || "";
          return `<span class="attachment">附件：${ui.escapeHtml(ui.formatAttachmentPath(path))}</span>`;
        }).join("");
        const isJobStatus = message.result && message.result.job_id;
        const resultHtml = message.result
          ? (isJobStatus
            ? renderJobCard(message.result)
            : `<pre>${ui.escapeHtml(JSON.stringify(message.result, null, 2))}</pre>`)
          : "";
        return `
          <div class="message ${message.role}">
            <div>${ui.escapeHtml(message.content || "")}</div>
            ${attachments}
            ${resultHtml}
          </div>
        `;
      }).join("");
      messagesEl.scrollTop = messagesEl.scrollHeight;
      updateActionButtons();
    }

    function renderSteps(status) {
      return ui.stageProgress(status).map((step) => `
        <li class="step ${step.state}">
          <span class="step-dot"></span>
          <div>
            <span>${ui.escapeHtml(step.label)}</span>
            <small>${ui.escapeHtml(step.description)}</small>
          </div>
        </li>
      `).join("");
    }

    function targetLabel(item, hole = null) {
      const number = item.number || item.part_id || "未编号";
      if (hole) {
        const handle = hole.entity_handle || hole.hole_id || "孔洞";
        return `孔洞 | ${number} | ${handle} | ${Number(hole.area || 0).toFixed(1)} mm²`;
      }
      return `面板 | ${number} | ${item.hole_count || 0} 孔 | ${Number(item.area || 0).toFixed(1)} mm²`;
    }

    function updateCorrectionTargetSummary() {
      const labels = state.selectedCorrectionTargets.map((value) => {
        const option = Array.from(correctionTargetSelectEl.options)
          .find((item) => item.value === value);
        return option ? option.textContent : value;
      });
      correctionTargetSummaryEl.textContent = labels.length
        ? `已选择：${labels.join("、")}`
        : "未选择目标";
    }

    function syncPreviewSelection() {
      const selected = new Set(state.selectedCorrectionTargets);
      for (const option of correctionTargetSelectEl.options) {
        option.selected = selected.has(option.value);
      }
      const attention = new Set(state.activeLearningTargets);
      drawingPreviewSvgEl.querySelectorAll("[data-preview-target]").forEach((element) => {
        element.classList.toggle("selected", selected.has(element.dataset.previewTarget));
        element.classList.toggle("attention", attention.has(element.dataset.previewTarget));
      });
      updateCorrectionTargetSummary();
    }

    function toggleCorrectionTarget(value) {
      if (!value) return;
      const target = String(value);
      if (state.selectedCorrectionTargets.includes(target)) {
        state.selectedCorrectionTargets = state.selectedCorrectionTargets.filter(
          (item) => item !== target,
        );
      } else {
        state.selectedCorrectionTargets = [...state.selectedCorrectionTargets, target];
      }
      syncPreviewSelection();
    }

    function previewPoints(points) {
      return (points || []).map((point) => `${point[0]},${point[1]}`).join(" ");
    }

    function renderDrawingPreview(payload) {
      const entities = payload.entities || [];
      const viewBox = payload.view_box || [0, 0, 1, 1];
      const labelSize = Math.max(Math.max(Number(viewBox[2]), Number(viewBox[3])) / 110, 1);
      const shapes = [];
      for (const entity of entities) {
        const target = ui.correctionTargetId(entity);
        const kind = ui.escapeHtml(entity.kind || "entity");
        const role = ui.escapeHtml(entity.role || "outer");
        const title = entity.number
          || entity.entity_handle
          || target
          || "图纸实体";
        shapes.push(
          `<polygon class="preview-shape preview-${kind} role-${role}" `
          + `points="${ui.escapeHtml(previewPoints(entity.points))}" `
          + `data-preview-target="${ui.escapeHtml(target)}">`
          + `<title>${ui.escapeHtml(title)}</title></polygon>`,
        );
        if (entity.kind === "panel" && entity.role === "outer" && entity.label_position) {
          const [x, y] = entity.label_position;
          shapes.push(
            `<text class="preview-label" x="${x}" y="${y}" `
            + `font-size="${labelSize}" data-preview-target="${ui.escapeHtml(target)}">`
            + `${ui.escapeHtml(entity.number || target)}</text>`,
          );
        }
      }
      drawingPreviewSvgEl.setAttribute("viewBox", viewBox.join(" "));
      drawingPreviewSvgEl.innerHTML = `<g>${shapes.join("")}</g>`;
      state.previewOriginalViewBox = [...viewBox];
      const counts = payload.counts || {};
      drawingPreviewSummaryEl.textContent = (
        `面板 ${counts.panels || 0} · 孔洞 ${counts.holes || 0} · `
        + `未识别 ${counts.unrecognized || 0} · 版本 r${payload.revision || 0}`
      );
      drawingPreviewEmptyEl.hidden = entities.length > 0;
      drawingPreviewEmptyEl.textContent = entities.length ? "" : "当前图纸没有可预览的封闭实体";
      syncPreviewSelection();
    }

    function zoomDrawingPreview(factor) {
      const viewBox = drawingPreviewSvgEl.getAttribute("viewBox");
      if (!viewBox) return;
      const values = viewBox.split(/\s+/).map(Number);
      if (values.length !== 4 || values.some((value) => !Number.isFinite(value))) return;
      const [x, y, width, height] = values;
      const nextWidth = width * factor;
      const nextHeight = height * factor;
      const nextX = x + (width - nextWidth) / 2;
      const nextY = y + (height - nextHeight) / 2;
      drawingPreviewSvgEl.setAttribute(
        "viewBox",
        [nextX, nextY, nextWidth, nextHeight].map((value) => value.toFixed(3)).join(" "),
      );
    }

    function fitDrawingPreview() {
      if (!state.previewOriginalViewBox) return;
      drawingPreviewSvgEl.setAttribute(
        "viewBox",
        state.previewOriginalViewBox.map((value) => Number(value).toFixed(3)).join(" "),
      );
    }

    function hideDrawingPreview() {
      state.preview = null;
      state.previewJobId = null;
      state.previewRevision = null;
      drawingPreviewEl.hidden = true;
      drawingPreviewSvgEl.innerHTML = "";
      drawingPreviewDownloadEl.hidden = true;
    }

    function updatePreviewDownload(status, revision) {
      const key = ui.previewArtifactKey(ui.jobArtifacts(status), revision);
      if (!key || !status || !status.job_id) {
        drawingPreviewDownloadEl.hidden = true;
        return;
      }
      drawingPreviewDownloadEl.href = (
        `${API_BASE}/jobs/${encodeURIComponent(status.job_id)}`
        + `/artifacts/${encodeURIComponent(key)}`
      );
      drawingPreviewDownloadEl.hidden = false;
    }

    async function loadDrawingPreview(status, force = false) {
      const correctionContext = (status && status.correction_context) || {};
      const parts = correctionContext.parts || [];
      const unrecognized = correctionContext.unrecognized_entities || [];
      if (!status || !status.job_id || (!parts.length && !unrecognized.length)) {
        hideDrawingPreview();
        return;
      }

      const revision = Number(
        status.correction_revision || correctionContext.correction_revision || 0,
      );
      updatePreviewDownload(status, revision);
      const cacheHit = (
        !force
        && state.preview
        && state.previewJobId === status.job_id
        && state.previewRevision === revision
      );
      if (cacheHit) return;

      const requestToken = state.previewRequestToken + 1;
      state.previewRequestToken = requestToken;
      drawingPreviewEl.hidden = false;
      drawingPreviewSummaryEl.textContent = "正在加载几何...";
      drawingPreviewEmptyEl.hidden = false;
      drawingPreviewEmptyEl.textContent = "正在加载原位 DXF 预览...";
      drawingPreviewSvgEl.innerHTML = "";
      try {
        const payload = await api(
          `/jobs/${encodeURIComponent(status.job_id)}/drawing-preview`,
        );
        if (requestToken !== state.previewRequestToken) return;
        state.preview = payload;
        state.previewJobId = status.job_id;
        state.previewRevision = Number(payload.revision || revision);
        renderDrawingPreview(payload);
        updatePreviewDownload(status, state.previewRevision);
      } catch (error) {
        if (requestToken !== state.previewRequestToken) return;
        drawingPreviewEl.hidden = false;
        drawingPreviewSummaryEl.textContent = "预览加载失败";
        drawingPreviewEmptyEl.hidden = false;
        drawingPreviewEmptyEl.textContent = error.message;
      }
    }
    function renderCorrectionTargets(status) {
      const correctionContext = (status && status.correction_context) || {};
      const parts = correctionContext.parts || [];
      const unrecognized = correctionContext.unrecognized_entities || [];
      if (!parts.length && !unrecognized.length) {
        correctionTargetsEl.hidden = true;
        correctionTargetSelectEl.innerHTML = "";
        state.selectedCorrectionTargets = [];
        correctionTargetSummaryEl.textContent = "未选择目标";
        return;
      }

      const options = [];
      for (const part of parts) {
        const panelTarget = ui.correctionTargetId(part);
        options.push({
          value: panelTarget,
          label: targetLabel(part),
        });
        for (const hole of (part.holes || [])) {
          const holeTarget = ui.correctionTargetId(hole);
          if (!holeTarget) continue;
          options.push({
            value: holeTarget,
            label: targetLabel(part, hole),
          });
        }
      }
      for (const entity of unrecognized) {
        const entityTarget = ui.correctionTargetId(entity);
        const entityArea = Number(entity.area || 0).toFixed(1);
        options.push({
          value: entityTarget,
          label: `未识别 | ` + entity.entity_handle + ` | ` + (entity.layer || `未知图层`) + ` | ` + entityArea + ` mm²`,
        });
      }

      correctionTargetsEl.hidden = false;
      correctionTargetSelectEl.innerHTML = options.map((option) => (
        `<option value="${ui.escapeHtml(option.value)}">${ui.escapeHtml(option.label)}</option>`
      )).join("");
      const available = new Set(options.map((option) => option.value));
      state.selectedCorrectionTargets = state.selectedCorrectionTargets.filter(
        (value) => available.has(value),
      );
      syncPreviewSelection();
    }

    function renderActiveLearning(status) {
      const queue = (
        status
        && status.correction_context
        && Array.isArray(status.correction_context.active_learning)
      ) ? status.correction_context.active_learning : [];
      state.activeLearningTargets = queue.map((item) => String(item.target_id || ""));
      if (!queue.length) {
        activeLearningEl.hidden = true;
        activeLearningListEl.innerHTML = "";
        activeLearningCountEl.textContent = "";
        syncPreviewSelection();
        return;
      }
      activeLearningEl.hidden = false;
      activeLearningCountEl.textContent = `${queue.length} 项`;
      activeLearningListEl.innerHTML = queue.map((item) => {
        const target = ui.escapeHtml(item.target_id || "");
        const kind = ui.escapeHtml(item.kind || "entity");
        const label = ui.escapeHtml(item.entity_handle || item.target_id || "");
        const reasons = (item.reasons || []).map((reason) => ui.escapeHtml(reason)).join("；");
        return (
          `<button type="button" class="active-learning-item" data-active-target="${target}">`
          + `${kind} · ${label}<small>${reasons}</small></button>`
        );
      }).join("");
      syncPreviewSelection();
    }
    function renderLearningMemory(status) {
      const learning = (status && status.correction_context && status.correction_context.learning) || {};
      const count = Number(learning.memory_feedback_count || 0);
      const feedbackCount = Number(learning.feedback_count || 0);
      if (!count && !feedbackCount) {
        learningMemorySummaryEl.textContent = "项目记忆尚未更新";
        return;
      }
      const updated = learning.memory_updated_at
        ? `，最近更新：${String(learning.memory_updated_at).slice(0, 19).replace("T", " ")}`
        : "";
      const modelVersion = learning.model_version
        ? `，全局模型：${String(learning.model_version).replace("recognition-model-", "")}`
        : "";
      learningMemorySummaryEl.textContent = (
        `项目记忆：已学习 ${count} 次，当前任务反馈 ${feedbackCount} 次${updated}${modelVersion}`
      );
    }
    function renderJobPanel(status) {
      if (!status) {
        jobPanelEl.hidden = true;
        hideDrawingPreview();
        updateActionButtons();
        return;
      }
      jobPanelEl.hidden = false;
      jobIdEl.textContent = status.job_id || "";
      const statusText = ui.jobStatusText(status);
      jobPillEl.textContent = statusText;
      jobPillEl.className = "pill";
      if (status.blocked) jobPillEl.classList.add("pill-danger");
      else if (status.completed) jobPillEl.classList.add("pill-success");
      else if (status.confirmation_required) jobPillEl.classList.add("pill-wait");

      stepsEl.innerHTML = renderSteps(status);
      metricsEl.innerHTML = renderMetrics(status);
      renderCorrectionTargets(status);
      renderLearningMemory(status);
      renderActiveLearning(status);
      loadDrawingPreview(status);

      const next = ui.nextAction(status);
      nextActionEl.innerHTML = `
        <strong>${ui.escapeHtml(next.text)}</strong>
        <span>${ui.escapeHtml(next.hint)}</span>
      `;

      jobErrorEl.hidden = !(status.error || status.blocked);
      jobErrorEl.textContent = status.error || "任务已阻塞，可点击“继续运行”尝试恢复";
      updateActionButtons();
    }

    function updateActionButtons() {
      const status = currentStatus();
      const availability = ui.actionAvailability(status, state.busy);
      document.querySelectorAll("button[data-action]").forEach((button) => {
        const stateForButton = availability[button.dataset.action];
        if (!stateForButton) return;
        button.disabled = stateForButton.disabled;
        button.title = stateForButton.reason;
      });
    }

    async function api(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const contentType = response.headers.get("content-type") || "";
      const payload = contentType.includes("application/json")
        ? await response.json()
        : await response.text();
      if (!response.ok) {
        throw new Error(ui.parseApiError(payload, response.status));
      }
      return payload;
    }

    async function ensureConversation() {
      if (state.conversationId) return;
      const conversation = await api("/conversations", {
        method: "POST",
        body: JSON.stringify({ tenant_id: "default" }),
      });
      state.conversationId = conversation.id;
      localStorage.setItem(CONVERSATION_KEY, conversation.id);
      setStatus(`会话 ${conversation.id} 已创建`);
    }

    async function uploadFile(file) {
      if (!file) return null;
      if (!ui.isDxfFile(file.name)) {
        throw new Error("仅支持 DXF 文件");
      }
      await ensureConversation();
      const path = `/inputs/${encodeURIComponent(file.name)}`;
      const response = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: file,
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(ui.parseApiError(payload, response.status));
      }
      return payload;
    }

    function renderFileChip(name) {
      if (!name) {
        fileChipEl.hidden = true;
        fileNameEl.textContent = "";
        filePickerLabelEl.textContent = "选择 DXF 文件";
        return;
      }
      fileChipEl.hidden = false;
      fileNameEl.textContent = name;
      filePickerLabelEl.textContent = "重新选择 DXF";
    }

    function intentDescription(intent, result) {
      if (!intent) return "已处理";
      if (intent.action === "create_job") {
        return `已创建排板任务，当前阶段：${ui.stageLabel(result && result.stage)}`;
      }
      if (intent.action === "get_job") {
        return `当前任务阶段：${ui.stageLabel(result && result.stage)}`;
      }
      if (intent.action === "confirm_job") {
        return `已提交确认，当前阶段：${ui.stageLabel(result && result.stage)}`;
      }
      if (intent.action === "run_job") {
        return `已提交继续运行，当前阶段：${ui.stageLabel(result && result.stage)}`;
      }
      if (intent.action === "cancel_job") {
        return `已提交取消任务，当前阶段：${ui.stageLabel(result && result.stage)}`;
      }
      if (intent.action === "review_job") {
        return `回看已提交：${result && result.original_total_sheets} -> ${result && result.reduced_total_sheets} 张板`;
      }
      return `已处理：${intent.action}`;
    }

    function pollJob(jobId, messageIndex) {
      stopPolling();
      const timer = setInterval(async () => {
        try {
          const status = await api(`/jobs/${encodeURIComponent(jobId)}`);
          updateLatestStatus(status);
          if (state.messages[messageIndex]) {
            state.messages[messageIndex].result = status;
          }
          renderMessages();
          renderJobPanel(status);
          if (
            status.completed
            || status.blocked
            || status.confirmation_required
            || status.stage === "cancelled"
          ) {
            clearInterval(timer);
          }
        } catch (error) {
          clearInterval(timer);
          setStatus(error.message, "error");
        }
      }, 2000);
      state.pollTimers.push(timer);
    }

    async function sendChat(content, attachments = [], parameters = null) {
      await ensureConversation();
      const message = await api(
        `/conversations/${state.conversationId}/messages`,
        {
          method: "POST",
          body: JSON.stringify({
            role: "user",
            content,
            attachments,
            parameters: parameters || {},
          }),
        },
      );
      state.messages.push(message);
      renderMessages();

      const response = await api(
        `/conversations/${state.conversationId}/respond`,
        { method: "POST" },
      );
      let result = response.result || null;
      if (result && !result.job_id && state.currentJobId) {
        result = { ...result, job_id: state.currentJobId };
      }
      const previousStatus = currentStatus();
      const displayResult = (
        result
        && result.job_id
        && !result.stage
        && previousStatus
      )
        ? { ...previousStatus, ...result }
        : result;
      state.messages.push({
        role: "assistant",
        content: intentDescription(response.intent, displayResult),
        result: displayResult,
      });
      updateLatestStatus(displayResult);
      renderMessages();
      renderJobPanel(displayResult);
      if (displayResult && displayResult.job_id) {
        pollJob(displayResult.job_id, state.messages.length - 1);
      }
      return response;
    }

    function directActionDescription(action, result) {
      if (action === "status") return "已刷新任务状态";
      if (action === "confirm") return `已提交确认，当前阶段：${ui.stageLabel(result && result.stage)}`;
      if (action === "run") return `已提交继续运行，当前阶段：${ui.stageLabel(result && result.stage)}`;
      if (action === "cancel") return `已取消任务，当前阶段：${ui.stageLabel(result && result.stage)}`;
      if (action === "review") {
        return result && result.status === "review_queued"
          ? "回看减板已排队，正在后台处理"
          : `回看完成：${result && result.original_total_sheets} -> ${result && result.reduced_total_sheets} 张板`;
      }
      return "已处理";
    }

    async function runDirectAction(action) {
      const jobId = currentJobId();
      if (!jobId) {
        setStatus("还没有可操作的任务", "error");
        return;
      }
      setBusy(true);
      try {
        let result;
        if (action === "status") {
          result = await api(`/jobs/${encodeURIComponent(jobId)}`);
        } else if (action === "confirm") {
          result = await api(`/jobs/${encodeURIComponent(jobId)}/confirm`, {
            method: "POST",
            body: JSON.stringify({ decision: "confirm" }),
          });
        } else if (action === "run") {
          result = await api(`/jobs/${encodeURIComponent(jobId)}/run`, {
            method: "POST",
          });
        } else if (action === "review") {
          result = await api(`/jobs/${encodeURIComponent(jobId)}/review`, {
            method: "POST",
            body: JSON.stringify({ max_reductions: 1 }),
          });
        } else if (action === "cancel") {
          result = await api(`/jobs/${encodeURIComponent(jobId)}/cancel`, {
            method: "POST",
          });
        } else {
          throw new Error(`未知操作：${action}`);
        }

        if (action === "status") {
          updateLatestStatus(result);
          renderJobPanel(result);
          setStatus(`${ui.jobStatusText(result)}`, "success");
        } else if (action === "review") {
          const previousStatus = currentStatus();
          const messageStatus = previousStatus
            ? { ...previousStatus, review_status: result && result.status }
            : result;
          updateLatestStatus(previousStatus || result);
          state.messages.push({
            role: "assistant",
            content: directActionDescription(action, result),
            result: messageStatus,
          });
          renderMessages();
          renderJobPanel(previousStatus);
          setStatus(directActionDescription(action, result), "success");
          if (result && result.job_id) {
            pollJob(result.job_id, state.messages.length - 1);
          }
        } else {
          updateLatestStatus(result);
          state.messages.push({
            role: "assistant",
            content: directActionDescription(action, result),
            result,
          });
          renderMessages();
          renderJobPanel(result);
          setStatus(directActionDescription(action, result), "success");
          if (result && result.job_id) {
            pollJob(result.job_id, state.messages.length - 1);
          }
        }
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    async function handleSend() {
      const creatingJob = !currentJobId() && Boolean(state.lastUpload);
      const content = inputEl.value.trim() || (creatingJob ? "开始排板" : "");
      if (!content) {
        setStatus("请输入排板指令", "error");
        return;
      }
      if (state.busy) return;
      setBusy(true);
      try {
        const attachments = state.lastUpload ? [state.lastUpload] : [];
        const parameters = creatingJob
          ? buildNestingParameters()
          : {
              feedback_scope: correctionFeedbackScopeEl.value,
              ...(state.selectedCorrectionTargets.length
                ? { target_ids: [...state.selectedCorrectionTargets] }
                : {}),
            };
        await sendChat(content, attachments, parameters);
        state.lastUpload = null;
        state.selectedCorrectionTargets = [];
        inputEl.value = "";
        setStatus("指令已发送");
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    async function handleFileChange() {
      const file = fileEl.files[0];
      if (!file) return;
      try {
        state.lastUpload = await uploadFile(file);
        renderFileChip(file.name);
        setStatus(`已上传 ${file.name}，请确认下方排板参数`, "success");
      } catch (error) {
        renderFileChip(null);
        setStatus(error.message, "error");
      }
    }

    function newConversation() {
      stopPolling();
      state.conversationId = null;
      state.lastUpload = null;
      state.messages = [];
      state.currentJobId = null;
      state.latestStatus = null;
      state.selectedCorrectionTargets = [];
      localStorage.removeItem(CONVERSATION_KEY);
      fileEl.value = "";
      renderFileChip(null);
      inputEl.value = "";
      renderMessages();
      renderJobPanel(null);
      setStatus("已新建会话");
    }

    async function restoreConversation() {
      const conversationId = localStorage.getItem(CONVERSATION_KEY);
      if (!conversationId) {
        renderMessages();
        renderJobPanel(null);
        return;
      }
      try {
        const conversation = await api(`/conversations/${encodeURIComponent(conversationId)}`);
        state.conversationId = conversation.id;
        state.messages = conversation.messages || [];
        renderMessages();
        if (conversation.job_id) {
          const status = await api(`/jobs/${encodeURIComponent(conversation.job_id)}`);
          updateLatestStatus(status);
          state.messages.push({
            role: "assistant",
            content: "已恢复上次任务状态",
            result: status,
          });
          renderMessages();
          renderJobPanel(status);
          pollJob(status.job_id, state.messages.length - 1);
        } else {
          renderJobPanel(null);
        }
      } catch (error) {
        localStorage.removeItem(CONVERSATION_KEY);
        state.conversationId = null;
        state.messages = [];
        renderMessages();
        renderJobPanel(null);
        setStatus("未能恢复上次会话，已创建新会话", "error");
      }
    }

    sendEl.addEventListener("click", handleSend);
    fileEl.addEventListener("change", handleFileChange);
    document.getElementById("file-clear").addEventListener("click", () => {
      fileEl.value = "";
      state.lastUpload = null;
      renderFileChip(null);
      setStatus("已清除上传文件");
    });
    document.getElementById("btn-new").addEventListener("click", newConversation);
    activeLearningListEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-active-target]");
      if (!button) return;
      toggleCorrectionTarget(button.dataset.activeTarget);
    });
    correctionTargetSelectEl.addEventListener("change", () => {
      state.selectedCorrectionTargets = Array.from(correctionTargetSelectEl.options)
        .filter((option) => option.selected)
        .map((option) => option.value);
      syncPreviewSelection();
    });
    drawingPreviewSvgEl.addEventListener("click", (event) => {
      const shape = event.target.closest("[data-preview-target]");
      if (!shape) return;
      toggleCorrectionTarget(shape.dataset.previewTarget);
    });
    drawingPreviewSvgEl.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomDrawingPreview(event.deltaY < 0 ? 0.82 : 1.22);
    }, { passive: false });
    document.getElementById("drawing-preview-zoom-in").addEventListener("click", () => {
      zoomDrawingPreview(0.82);
    });
    document.getElementById("drawing-preview-zoom-out").addEventListener("click", () => {
      zoomDrawingPreview(1.22);
    });
    document.getElementById("drawing-preview-fit").addEventListener("click", fitDrawingPreview);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });
    document.querySelectorAll("button[data-action]").forEach((button) => {
      button.addEventListener("click", () => runDirectAction(button.dataset.action));
    });
    document.querySelectorAll("button[data-fill]").forEach((button) => {
      button.addEventListener("click", () => {
        inputEl.value = button.dataset.fill;
        inputEl.focus();
      });
    });
    document.querySelectorAll("#parameter-panel input, #parameter-panel select").forEach((element) => {
      element.addEventListener("input", syncParameterControls);
      element.addEventListener("change", syncParameterControls);
    });
    syncParameterControls();

    renderMessages();
    renderJobPanel(null);
    restoreConversation();
  </script>
</body>
</html>
