<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>识别模型运维</title>
  <style>
    :root { --bg:#f5f6f8; --panel:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --accent:#2563eb; --danger:#dc2626; --success:#16a34a; --warning:#d97706; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
    header { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); }
    h1 { margin:0; font-size:18px; }
    main { max-width:1180px; margin:0 auto; padding:20px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .toolbar input { border:1px solid var(--border); border-radius:8px; padding:7px 9px; background:var(--panel); color:var(--text); }
    button { border:1px solid var(--border); border-radius:8px; padding:7px 11px; background:var(--panel); color:var(--text); cursor:pointer; }
    button.primary { background:var(--accent); color:white; border-color:var(--accent); }
    button.warning { color:var(--warning); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:16px; }
    .card, .section { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .card .label { color:var(--muted); font-size:12px; }
    .card .value { font-size:22px; font-weight:700; margin-top:6px; }
    .section { margin-bottom:16px; overflow:auto; }
    .section h2 { margin:0 0 10px; font-size:15px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    pre { margin:0; padding:12px; border-radius:8px; background:#0f172a; color:#dbeafe; overflow:auto; font-size:12px; }
    .status { min-height:20px; color:var(--muted); margin-bottom:10px; }
    .status.error { color:var(--danger); }
    .status.success { color:var(--success); }
    .pill { display:inline-block; border-radius:999px; padding:3px 8px; background:#eff6ff; color:var(--accent); font-size:12px; }
  </style>
</head>
<body>
<header>
  <div><h1>识别模型运维</h1><div class="status" id="status"></div></div>
  <button id="refresh">刷新</button>
</header>
<main>
  <div class="toolbar">
    <button id="dry-run">检查运维计划</button>
    <button id="run" class="primary">执行监控与重训</button>
    <button id="retention" class="warning">归档过期反馈</button>
    <input id="auth-tenant" placeholder="管理员租户 ID" value="default">
    <input id="auth-key" type="password" placeholder="API Key（可选）">
    <button id="save-auth">保存登录</button>
    <button id="clear-auth">清除登录</button>
  </div>
  <div class="cards" id="cards"></div>
  <section class="section">
    <h2>模型版本</h2>
    <div id="versions"></div>
  </section>
  <section class="section">
    <h2>反馈数据</h2>
    <div id="feedback"></div>
  </section>
  <section class="section">
    <h2>审计日志 <button id="export-audit">导出 JSONL</button></h2>
    <div id="audit"></div>
  </section>
  <section class="section">
    <h2>最近运维报告</h2>
    <pre id="operations"></pre>
  </section>
</main>
<script src="./admin-ui.js"></script>
<script>
const API = "/admin/recognition-model";
const ui = window.StonebotAdminUI;
const AUTH_KEY = "stonebot.admin.auth";
const statusEl = document.getElementById("status");
let current = null;

function setStatus(text, kind = "") {
  statusEl.textContent = text;
  statusEl.className = `status ${kind}`;
}
function esc(value) {
  return String(value == null ? "" : value)
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function storedAuth() {
  try {
    return JSON.parse(localStorage.getItem(AUTH_KEY) || "{}");
  } catch {
    return {};
  }
}
function requestHeaders() {
  const auth = storedAuth();
  return {
    "Content-Type": "application/json",
    ...ui.authHeaders(auth.apiKey, auth.tenantId),
  };
}
async function api(path, options = {}) {
  const response = await fetch(API + path, {
    headers: requestHeaders(),
    ...options,
  });
  const contentType = response.headers.get("content-type") || "";
  const payload = contentType.includes("application/json")
    ? await response.json()
    : await response.text();
  if (!response.ok) throw new Error(ui.parseError(payload, response.status));
  return payload;
}
function renderCards(data) {
  const model = data.current_model || {};
  const metrics = model.metrics || {};
  const values = [
    ["当前模型", model.model_version || "未激活"],
    ["准确率", metrics.accuracy == null ? "-" : metrics.accuracy],
    ["反馈总量", data.feedback?.total || 0],
    ["待归档", data.retention?.planned || 0],
  ];
  document.getElementById("cards").innerHTML = values.map(([label,value]) =>
    `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`
  ).join("");
}
function renderVersions(data) {
  const rows = (data.versions || []).map((item) => `
    <tr>
      <td>${esc(item.model_version)}${item.active ? ' <span class="pill">当前</span>' : ''}</td>
      <td>${esc(item.created_at || "")}</td>
      <td>${esc(item.sample_count || 0)} / ${esc(item.drawing_count || 0)}</td>
      <td>${esc(JSON.stringify(item.metrics || {}))}</td>
      <td><button data-version="${esc(item.file)}" ${item.active ? "disabled" : ""}>激活</button></td>
    </tr>`).join("");
  document.getElementById("versions").innerHTML = `
    <table><thead><tr><th>版本</th><th>创建时间</th><th>样本/图纸</th><th>指标</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5">暂无模型版本</td></tr>'}</tbody></table>`;
  document.querySelectorAll("[data-version]").forEach((button) => {
    button.addEventListener("click", () => activateVersion(button.dataset.version));
  });
}
function renderFeedback(data) {
  const counts = data.feedback?.tenant_counts || {};
  const rows = Object.entries(counts).map(([tenant,count]) =>
    `<tr><td>${esc(tenant)}</td><td>${esc(count)}</td></tr>`
  ).join("");
  document.getElementById("feedback").innerHTML = `
    <table><thead><tr><th>租户</th><th>反馈文件</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="2">暂无全局反馈</td></tr>'}</tbody></table>`;
}
function renderAudit(events) {
  const rows = (events || []).map((item) => `
    <tr>
      <td>${ui.escapeHtml(item.created_at || "")}</td>
      <td>${ui.escapeHtml(item.actor_tenant || "")}</td>
      <td>${ui.escapeHtml(ui.auditLabel(item.action, item.status))}</td>
      <td>${ui.escapeHtml(JSON.stringify(item.details || {}))}</td>
    </tr>`).join("");
  document.getElementById("audit").innerHTML = `
    <table><thead><tr><th>时间</th><th>操作租户</th><th>动作</th><th>详情</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4">暂无审计记录</td></tr>'}</tbody></table>`;
}async function load() {
  try {
    current = await api("/status");
    const audit = await api("/audit?limit=100");
    renderAudit(audit.events || []);
    renderCards(current);
    renderVersions(current);
    renderFeedback(current);
    document.getElementById("operations").textContent = JSON.stringify(
      current.operations || {}, null, 2
    );
    setStatus("状态已刷新");
  } catch (error) {
    setStatus(error.message, "error");
  }
}
async function runOperations(dryRun, applyRetention = false) {
  const buttons = document.querySelectorAll("button");
  buttons.forEach((button) => { button.disabled = true; });
  try {
    setStatus(dryRun ? "正在生成运维计划..." : "运维周期已提交...");
    const payload = await api("/operations", {
      method: "POST",
      body: JSON.stringify(ui.buildOperationPayload({
        dryRun,
        applyRetention,
      })),
    });
    setStatus(dryRun ? "运维计划已生成" : "运维周期正在后台执行", "success");
    if (!dryRun) setTimeout(load, 1500);
    else document.getElementById("operations").textContent = JSON.stringify(payload, null, 2);
  } catch (error) {
    setStatus(error.message, "error");
  } finally {
    buttons.forEach((button) => { button.disabled = false; });
  }
}
async function activateVersion(version) {
  if (!confirm(`确认激活模型 ${version}？`)) return;
  try {
    const payload = await api("/rollback", {
      method: "POST",
      body: JSON.stringify({ version }),
    });
    setStatus(`已激活 ${payload.model_version}`, "success");
    await load();
  } catch (error) {
    setStatus(error.message, "error");
  }
}
const savedAuth = storedAuth();
document.getElementById("auth-tenant").value = savedAuth.tenantId || "default";
document.getElementById("auth-key").value = savedAuth.apiKey || "";
document.getElementById("save-auth").addEventListener("click", () => {
  localStorage.setItem(AUTH_KEY, JSON.stringify({
    tenantId: document.getElementById("auth-tenant").value.trim(),
    apiKey: document.getElementById("auth-key").value,
  }));
  setStatus("登录信息已保存", "success");
  load();
});
document.getElementById("clear-auth").addEventListener("click", () => {
  localStorage.removeItem(AUTH_KEY);
  document.getElementById("auth-key").value = "";
  setStatus("登录信息已清除");
  load();
});
document.getElementById("export-audit").addEventListener("click", async () => {
  try {
    const response = await fetch(`${API}/audit/export`, { headers: requestHeaders() });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "recognition-model-audit.jsonl";
    link.click();
    URL.revokeObjectURL(url);
  } catch (error) {
    setStatus(error.message, "error");
  }
});document.getElementById("refresh").addEventListener("click", load);
document.getElementById("dry-run").addEventListener("click", () => runOperations(true));
document.getElementById("run").addEventListener("click", () => runOperations(false));
document.getElementById("retention").addEventListener("click", async () => {
  if (confirm("确认归档过期或超量反馈？")) await runOperations(false, true);
});
load();
</script>
</body>
</html>
